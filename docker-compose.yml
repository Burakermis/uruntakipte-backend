services:
  redis:
    image: redis:7-alpine
    ports:
      # Yalnızca yerel makine: "6379:6379" Redis'i (şifresiz) ağdaki herkese açıyordu.
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trackprice
      POSTGRES_PASSWORD: trackprice
      POSTGRES_DB: trackprice
    ports:
      # Yalnızca yerel makine: aksi halde varsayılan parolalı (trackprice) Postgres ağa açık kalıyordu.
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  redis-data:
  postgres-data:
